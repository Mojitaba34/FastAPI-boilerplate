<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Home</title>
    <style>
        /* Reset default margin and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 350px;
        }

        h1 {
            color: #009485;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        /* Button Container */
        .btn-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn {
            flex: 1; /* Ensures equal width */
            padding: 10px 15px;
            font-size: 16px;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
            white-space: nowrap; /* Prevents text from breaking */
        }

        .btn.docs {
            background-color: #26a699;
        }

        .btn.docs:hover {
            background-color: #1b8275;
        }

        .btn.redoc {
            background-color: #26a699;
        }

        .btn.redoc:hover {
            background-color: #1b8275;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🚀 Welcome to FastAPI</h1>
    <p>Your API is up and running!</p>
    <div class="btn-container">
        <a href="/docs" class="btn docs">Swagger UI</a>
        <a href="/redoc" class="btn redoc">ReDoc UI</a>
    </div>
</div>
</body>
</html>
